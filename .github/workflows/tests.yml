name: Kodkontroll
on:
  push:
    branches: [main, "improve/**"]
  pull_request:

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Testa datamodell och Shopify-anrop
        run: npm test
